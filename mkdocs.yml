site_name: Raspbot V2 Unofficial Documentation
nav: 
    - Home: index.md
    - User Guide: 
        - "Getting Started": 0.ssh_to_raspberry_pi.md
        - "Installation Of Libraries": 1.installing_libraries.md
        - "Library Basics": 2.library_basics.md
        - "Control Of Motors": 3.motor_control.md
        - "Using The Ultrasonic Sensors": 4.read_ultrasonic.md
        - "Line Following Module": 5.line_following_module.md
        - "Other Built-In Libraries": 6.other_pre_written_libraries.md
        - "Simple Obstacle Avoidance Robot": 7.simple_obstacle_avoidance.md
        - "Infrared Remote Control": 8.ir_remote_controlled.md
        - "Computer Vision": 9.computer_vision.md
        - "Using ROS": 10.using_ROS.md

theme:
    name: mkdocs
    user_color_mode_toggle: true

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
    - search
    - mermaid2
